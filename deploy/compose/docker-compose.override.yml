# -----------------------------------------------------------------------------
#
# Purpose: hot reload.
#   - Go   : air (github.com/air-verse/air)
#   - Next : next dev
#
# This file must never reach production. Production uses an explicit
# docker-compose.prod.yml (Week 4).

# TODO Week 2
# -----------------------------------------------------------------------------

services:
  api:
    build:
      target: builder
    image: campus-lms-api:dev-hot
    working_dir: /src
    environment:
      GOBIN: /go/bin
      GOCACHE: /go/cache
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -x /go/bin/air ]; then
          go install github.com/air-verse/air@v1.61.7
        fi
        exec /go/bin/air --tmp_dir /tmp/air --build.cmd "go build -o /tmp/air/api ./cmd/api" --build.bin /tmp/air/api
    volumes:
      - ../../apps/api:/src
      - go-module-cache:/go/pkg/mod
      - go-build-cache:/go/cache
      - air-bin:/go/bin
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  go-module-cache:
  go-build-cache:
  air-bin:
