# Development Compose definition. Services are grouped by profile so the
# local stack can be started selectively; health checks, dependency conditions,
# memory limits, restart policy, and env-file configuration remain explicit.

name: campus-lms

services:
  api:
    profiles: [core]
    build:
      context: ../../apps/api
    image: campus-lms-api:dev
    env_file:
      - ../../.env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped
    # The production image supplies its own /api -healthcheck probe.

  postgres:
    profiles: [core]
    image: postgres:16.14-alpine3.23
    env_file:
      - ../../.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  redis:
    profiles: [core]
    image: redis:7.4.10-alpine3.21
    env_file:
      - ../../.env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 128m
    restart: unless-stopped

volumes:
  postgres-data:
